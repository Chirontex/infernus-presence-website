[www]
; Unix user/group of processes
user = app
group = app

; The address on which to accept FastCGI requests
listen = 9000

; The port on which to listen. "listen" must be set to a valid host/port value or a unix socket.
listen.backlog = 65535

; Set listen(2) backlog. See http://php.net/listen.backlog
listen.allowed_clients = 127.0.0.1, ::1, nginx

; Logging
access.log = /proc/self/fd/2
catch_workers_output = yes

; Maximum number of children that can be alive at the same time
pm = dynamic
pm.max_children = 50
pm.start_servers = 10
pm.min_spare_servers = 5
pm.max_spare_servers = 35
pm.process_idle_timeout = 10s
pm.max_requests = 500

; Pass environment variables
clear_env = no
