version: '3.9'

services:
  # MariaDB Database Service
  database:
    image: mariadb:12
    container_name: infernus-database
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'no'
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - database_data:/var/lib/mysql
    networks:
      - infernus-network
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--su=mysql", "--connect", "--innodb_initialized" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # PHP-FPM Backend Service (Symfony)
  backend:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    container_name: infernus-backend
    environment:
      APP_ENV: ${APP_ENV}
      APP_DEBUG: ${APP_DEBUG}
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: mysql://${DB_USER}:${DB_PASSWORD}@database:3306/${DB_NAME}?serverVersion=12.0&charset=utf8mb4
      CORS_ALLOW_ORIGIN: ^https?://(${FRONTEND_HOST}|${FRONTEND_HOST})(:[0-9]+)?$
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ./backend/app:/app
      - ./runtime/php-fpm:/run
    working_dir: /app
    networks:
      - infernus-network
    healthcheck:
      test: [ "CMD", "test", "-S", "/run/php-fpm.sock" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Node.js Frontend Service (Nuxt 4)
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: docker/Dockerfile
  #     args:
  #       - NODE_VERSION=18
  #   container_name: infernus-frontend
  #   environment:
  #     NODE_ENV: ${NODE_ENV}
  #     NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE}
  #   depends_on:
  #     - backend
  #   ports:
  #     - "${FRONTEND_PORT}:3000"
  #   volumes:
  #     - ./frontend:/app
  #     - /app/node_modules
  #     - /app/.nuxt
  #   working_dir: /app
  #   networks:
  #     - infernus-network
  #   restart: unless-stopped
  #   # Development mode with hot reload
  #   command: npm run dev

  # nginx Web Server and Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: infernus-nginx
    depends_on:
      - backend
    #  - frontend
    ports:
      - "${HTTP_PORT}:80"
      - "${HTTPS_PORT}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./backend/app/public:/app/public:ro
    #  - ./frontend/public:/app/frontend/public:ro
      - nginx_logs:/var/log/nginx
      - ./runtime/php-fpm:/run:ro
    networks:
      - infernus-network
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  database_data:
    driver: local
  nginx_logs:
    driver: local

networks:
  infernus-network:
    driver: bridge
